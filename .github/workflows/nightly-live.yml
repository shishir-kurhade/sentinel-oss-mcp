name: Nightly live Gemini evaluation

on:
  # Re-enable the schedule only after the nightly-live environment contains
  # the Gemini credential and all required pricing provenance variables.
  workflow_dispatch:

concurrency:
  group: nightly-live-gemini
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Gemini evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nightly-live
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SENTINEL_OFFLINE: "0"
      SENTINEL_SEMANTIC_ENABLED: "0"
      SENTINEL_DATA_DIR: /tmp/sentinel
      SENTINEL_EVAL_CORPUS_COMMIT: ${{ github.sha }}
      SENTINEL_EVAL_PRICE_SOURCE_URL: ${{ vars.SENTINEL_EVAL_PRICE_SOURCE_URL }}
      SENTINEL_EVAL_PRICE_ACCESSED_AT: ${{ vars.SENTINEL_EVAL_PRICE_ACCESSED_AT }}
      SENTINEL_LIGHTWEIGHT_INPUT_PRICE_PER_MILLION: ${{ vars.SENTINEL_LIGHTWEIGHT_INPUT_PRICE_PER_MILLION }}
      SENTINEL_LIGHTWEIGHT_OUTPUT_PRICE_PER_MILLION: ${{ vars.SENTINEL_LIGHTWEIGHT_OUTPUT_PRICE_PER_MILLION }}
      SENTINEL_EXPERT_INPUT_PRICE_PER_MILLION: ${{ vars.SENTINEL_EXPERT_INPUT_PRICE_PER_MILLION }}
      SENTINEL_EXPERT_OUTPUT_PRICE_PER_MILLION: ${{ vars.SENTINEL_EXPERT_OUTPUT_PRICE_PER_MILLION }}
    steps:
      - uses: actions/checkout@v4
      - name: Require protected live-evaluation configuration
        shell: bash
        run: |
          missing=()
          [[ -n "${GOOGLE_API_KEY}" ]] || missing+=("GOOGLE_API_KEY secret")
          [[ -n "${SENTINEL_LIGHTWEIGHT_INPUT_PRICE_PER_MILLION}" ]] || missing+=("SENTINEL_LIGHTWEIGHT_INPUT_PRICE_PER_MILLION variable")
          [[ -n "${SENTINEL_LIGHTWEIGHT_OUTPUT_PRICE_PER_MILLION}" ]] || missing+=("SENTINEL_LIGHTWEIGHT_OUTPUT_PRICE_PER_MILLION variable")
          [[ -n "${SENTINEL_EXPERT_INPUT_PRICE_PER_MILLION}" ]] || missing+=("SENTINEL_EXPERT_INPUT_PRICE_PER_MILLION variable")
          [[ -n "${SENTINEL_EXPERT_OUTPUT_PRICE_PER_MILLION}" ]] || missing+=("SENTINEL_EXPERT_OUTPUT_PRICE_PER_MILLION variable")
          [[ -n "${SENTINEL_EVAL_PRICE_SOURCE_URL}" ]] || missing+=("SENTINEL_EVAL_PRICE_SOURCE_URL variable")
          [[ -n "${SENTINEL_EVAL_PRICE_ACCESSED_AT}" ]] || missing+=("SENTINEL_EVAL_PRICE_ACCESSED_AT variable")
          if (( ${#missing[@]} )); then
            printf 'Missing required live-evaluation configuration: %s\n' "${missing[*]}" >&2
            echo "Set all four rates plus the official pricing source URL and access date; Sentinel has no price defaults." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gemini and evaluation dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[gemini,dev]"
      - name: Run versioned live evaluation
        run: >-
          sentinel-oss eval
          --live
          --enforce-gates
          --output reports/nightly-gemini.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gemini-report-${{ github.run_id }}
          path: reports/nightly-gemini.json
          if-no-files-found: warn
          retention-days: 30
